# GoReleaser config for creel.
# Docs: https://goreleaser.com
#
# Triggered by .github/workflows/release.yml on `git push --tags v*`.
# Builds cross-platform binaries and publishes a GitHub Release with checksums
# and a changelog.
#
# Package managers are maintained separately from this config:
# - Homebrew tap: rsiota/homebrew-creel (GoReleaser deprecated `brews` in favour
#   of macOS-only `homebrew_casks`)
# - Scoop bucket: rsiota/scoop-creel (GoReleaser's Scoop publisher is Pro-only)
# - AUR creel-bin: packaging/aur/creel-bin (push to aur.archlinux.org)
# After each tag, run ./scripts/update-packaging.sh and sync the tap/bucket/AUR
# (see packaging/README.md).

version: 2

project_name: creel

before:
  hooks:
    - go mod tidy

builds:
  - id: creel
    main: ./cmd/creel
    binary: creel
    env:
      - CGO_ENABLED=0 # pure-Go (modernc.org/sqlite) — cross-compiles cleanly
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/rsiota/creel/internal/version.Version={{.Tag}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
